# =====================================================================
#  สรุปพยากรณ์ประจำวัน บางปะกง — ส่งทุกเช้าราว 07:00 น. เวลาไทย
# ---------------------------------------------------------------------
#  ไฟล์นี้ต้องวางไว้ที่:  .github/workflows/daily-summary.yml
#  ใช้สคริปต์ตัวเดียวกัน แต่สั่งด้วย --daily ซึ่งเป็นคนละโหมดกับการเตือน
#  --daily  = สรุปทั้งวัน (แดด อุณหภูมิ ช่วงฝน ลม UV) มองข้ามคืนถึงเย็น
#  --force  = โหมดเดิม บอกแค่ 3 ชม.ข้างหน้า ใช้ตอนอยากเช็คสถานะเดี๋ยวนั้น
# =====================================================================

name: สรุปอากาศประจำวัน บางปะกง

on:
  schedule:
    # 22:17 UTC = 05:17 เวลาไทย แล้วสคริปต์ "รอ" จนถึง 06:58 ค่อยส่ง
    #
    # ทำไมไม่ตั้ง '0 0 * * *' (07:00 ไทย) ตรง ๆ แบบเดิม:
    # 00:00 UTC คือเที่ยงคืน UTC ช่วงที่คิว GitHub แน่นที่สุดในโลก วัดจริง
    # 8-23 ก.ย. 2569 ข้อความมาถึง 09:29-09:54 ทุกวัน (ช้า 150-175 นาที)
    # จึงตั้งให้เริ่มก่อนเวลาและหลบนาที :00 แล้วให้สคริปต์รอเอง:
    #   GitHub ตรงเวลา -> รอแล้วส่ง ~07:00 พอดี
    #   GitHub ช้า     -> ส่งทันทีที่ได้รัน (ช้ากว่าเดิมไม่ได้)
    - cron: '17 22 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    # เผื่อเวลารอถึง 06:58 (สูงสุด ~100 นาที) + ลองดึงข้อมูล/ส่งซ้ำ
    # เดิมตั้ง 5 นาที ถ้า API ตอบช้า job จะถูกตัดทิ้ง ส่งไม่ถึงทั้งวัน
    timeout-minutes: 130

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests pillow

      - name: ส่งสรุปประจำวัน
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMD_TOKEN: ${{ secrets.TMD_TOKEN }}
          WX_LAT: '13.53'
          WX_LON: '100.99'
          WX_PLACE: 'บางปะกง'
        # --daily = สรุปทั้งวัน ส่งเสมอ ไม่ยุ่งกับ cooldown ของฝั่งเตือน
        run: python rain_alert_telegram.py --daily
