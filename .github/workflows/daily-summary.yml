# =====================================================================
#  สรุปพยากรณ์ประจำวัน บางปะกง — ส่งทุกเช้า 07:00 น. เวลาไทย
# ---------------------------------------------------------------------
#  ไฟล์นี้ต้องวางไว้ที่:  .github/workflows/daily-summary.yml
#  ใช้สคริปต์ตัวเดียวกัน แต่สั่งด้วย --daily ซึ่งเป็นคนละโหมดกับการเตือน
#  --daily  = สรุปทั้งวัน (แดด อุณหภูมิ ช่วงฝน ลม UV) มองข้ามคืนถึงเย็น
#  --force  = โหมดเดิม บอกแค่ 3 ชม.ข้างหน้า ใช้ตอนอยากเช็คสถานะเดี๋ยวนั้น
# =====================================================================

name: สรุปอากาศประจำวัน บางปะกง

on:
  schedule:
    # 00:00 UTC = 07:00 เวลาไทย (UTC+7)
    # หมายเหตุ: ตัวตั้งเวลาของ GitHub มักมาช้ากว่าเวลาที่ตั้งไว้ 5-15 นาที
    # ในช่วงที่คนใช้เยอะ ถือเป็นเรื่องปกติของบริการฟรี ไม่ใช่ระบบพัง
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: pip install requests pillow

      - name: ส่งสรุปประจำวัน
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMD_TOKEN: ${{ secrets.TMD_TOKEN }}
          WX_LAT: '13.53'
          WX_LON: '100.99'
          WX_PLACE: 'บางปะกง'
        # --daily = สรุปทั้งวัน ส่งเสมอ ไม่ยุ่งกับ cooldown ของฝั่งเตือน
        run: python rain_alert_telegram.py --daily
