# =====================================================================
#  แจ้งเตือนฝน บางปะกง — รันบนเซิร์ฟเวอร์ GitHub ฟรี ไม่ต้องเปิดคอม
# ---------------------------------------------------------------------
#  ไฟล์นี้ต้องวางไว้ที่:  .github/workflows/rain-alert.yml
#  (ต้องมีจุดนำหน้า .github และต้องอยู่ในโฟลเดอร์ workflows)
# =====================================================================

name: แจ้งเตือนฝน บางปะกง

on:
  schedule:
    # รันทุกชั่วโมง — เวลาใน cron ของ GitHub เป็น UTC เสมอ
    # แต่สคริปต์แปลงเป็นเวลาไทยเองแล้ว จึงไม่ต้องชดเชยตรงนี้
    - cron: '0 * * * *'

  # ปุ่มกดรันเองสำหรับทดสอบ (อยู่ในแท็บ Actions)
  workflow_dispatch:

# ต้องมีสิทธิ์เขียน เพื่อบันทึกไฟล์ประวัติการเตือนกลับเข้า repo
permissions:
  contents: write

# กันไม่ให้รันซ้อนกันถ้ารอบก่อนยังไม่จบ
concurrency:
  group: rain-alert
  cancel-in-progress: false

jobs:
  check-rain:
    runs-on: ubuntu-latest
    # ต้องมากกว่าเวลาเฝ้าดู (50 นาที) เผื่อขั้นตอนติดตั้งและ commit
    timeout-minutes: 58

    steps:
      - name: ดึงโค้ดจาก repo
        uses: actions/checkout@v5

      - name: ติดตั้ง Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ติดตั้งไลบรารีที่ต้องใช้
        run: pip install requests pillow

      # ---------------------------------------------------------------
      #  เครื่องของ GitHub Actions เป็นเครื่องใหม่ทุกรอบ ไฟล์ที่เขียนไว้
      #  รอบก่อนจะหายหมด ระบบกันเตือนซ้ำ (cooldown) จึงต้องอาศัย cache
      #  ช่วยเก็บไฟล์ state ข้ามรอบ ไม่งั้นจะเตือนซ้ำทุกชั่วโมง
      # ---------------------------------------------------------------
      - name: กู้ไฟล์ state รอบก่อน (สำหรับกันเตือนซ้ำ)
        uses: actions/cache/restore@v5
        with:
          path: rain_alert_state.json
          key: rain-state-${{ github.run_id }}
          restore-keys: |
            rain-state-

      # ---------------------------------------------------------------
      #  ทำไมต้อง --watch แทนที่จะตั้ง cron ให้ถี่ขึ้น
      # ---------------------------------------------------------------
      #  วัดจากประวัติการรันจริง 100 รอบ: ตั้ง cron ไว้ทุก 20 นาที
      #  แต่ GitHub รันให้ห่างกันต่ำสุด 41 นาที กลาง 63 นาที สูงสุด 163 นาที
      #  ไม่เคยตรงเลยสักครั้ง เพราะ GitHub ถ่วงคิว scheduled workflow
      #  ที่ตั้งถี่เป็นนโยบาย — ตั้งถี่กว่านี้ก็ไม่ช่วย
      #
      #  ผลคือระบบตาบอด 167 ชั่วโมงจาก 12 วัน ขณะที่ฝนบ้านเราตกครั้งละ
      #  30-60 นาที จึงพลาดโดยโครงสร้าง ไม่เกี่ยวกับเกณฑ์ที่ตั้งไว้เลย
      #
      #  จึงเปลี่ยนเป็น: cron ยิงชั่วโมงละครั้ง แล้วอยู่ยาวในรอบนั้น 45 นาที
      #  วนเช็คเองทุก 5 นาที = ~240 ครั้ง/วัน แทนที่จะเป็น 16 ครั้ง/วัน
      #  repo นี้เป็น public จึงใช้เวลา GitHub Actions ได้ไม่จำกัด
      #
      #  45 ไม่ใช่ 60 เพราะเวลาจริงจะยาวกว่าเลขนี้เล็กน้อย (แต่ละรอบใช้เวลา
      #  ยิง API ราว 10-20 วินาที) บวกเวลาติดตั้งและ commit อีก จึงต้องเผื่อ
      #  ให้จบก่อน cron รอบถัดไปมา ไม่งั้นงานจะซ้อนคิวกันไปเรื่อย ๆ
      # ---------------------------------------------------------------
      - name: เฝ้าดูสภาพอากาศต่อเนื่อง 45 นาที (เช็คทุก 5 นาที)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TMD_TOKEN: ${{ secrets.TMD_TOKEN }}
          WX_LAT: '13.53'
          WX_LON: '100.99'
          WX_PLACE: 'บางปะกง'
        run: python rain_alert_telegram.py --watch 45 --every 5

      - name: บันทึกไฟล์ state ไว้ใช้รอบหน้า
        if: always()
        uses: actions/cache/save@v5
        with:
          path: rain_alert_state.json
          key: rain-state-${{ github.run_id }}

      # ---------------------------------------------------------------
      #  บันทึกประวัติการเตือนกลับเข้า repo
      # ---------------------------------------------------------------
      #  ทำไมต้อง commit ไม่ใช้ cache เหมือน state:
      #  ไฟล์นี้มีช่อง "ฝนตกจริง (Y/N)" ที่คุณต้องกรอกเอง ถ้าเก็บใน cache
      #  จะแก้ไม่ได้เลย แต่ถ้า commit เข้า repo จะกดแก้ผ่านเว็บ GitHub ได้
      #  แล้วเปิดดูสถิติย้อนหลังว่าระบบเตือนแม่นกี่ %
      # ---------------------------------------------------------------
      #  radar_watch.csv จดค่าเรดาร์ทุกรอบ (~72 แถว/วัน) ไม่ว่าจะเตือนหรือไม่
      #  ต้อง commit เหมือนกัน เพราะเป็นข้อมูลที่ใช้จูนเกณฑ์ ถ้าเก็บใน cache
      #  จะโหลดมาดูไม่ได้ และหายเมื่อ cache หมดอายุ
      - name: บันทึกประวัติการเตือนเข้า repo
        if: always()
        run: |
          if [ ! -f alert_log.csv ] && [ ! -f radar_watch.csv ]; then
            echo "ไม่มีรายการใหม่ ข้ามขั้นตอนนี้"
            exit 0
          fi

          git config user.name  "rain-alert-bot"
          git config user.email "actions@github.com"

          # ดึงของใหม่ก่อน เผื่อคุณเพิ่งแก้ไฟล์ผ่านเว็บ จะได้ไม่ชนกัน
          git pull --rebase --autostash origin ${{ github.ref_name }} || true

          # -- ต่อท้ายชื่อไฟล์ที่มีจริงเท่านั้น กัน git add พังเพราะไฟล์ยังไม่เกิด
          FILES=""
          [ -f alert_log.csv ]   && FILES="$FILES alert_log.csv"
          [ -f radar_watch.csv ] && FILES="$FILES radar_watch.csv"
          git add $FILES

          if git diff --staged --quiet; then
            echo "ไม่มีอะไรเปลี่ยน"
          else
            git commit -m "log: บันทึกค่าที่วัดได้ $(date -u -d '+7 hours' '+%Y-%m-%d %H:%M') น."
            # push ชนกันได้ถ้ารอบก่อนยังค้าง — ลองใหม่อีกครั้งหลัง rebase
            git push origin HEAD:${{ github.ref_name }} || {
              git pull --rebase --autostash origin ${{ github.ref_name }}
              git push origin HEAD:${{ github.ref_name }}
            }
          fi
